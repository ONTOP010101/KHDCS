server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain,text/css,application/javascript
    min-response-size: 1024

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/photo_management?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&connectTimeout=30000&socketTimeout=60000
    username: root
    password: 123456
    hikari:
      maximum-pool-size: 80
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 300000
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/resources/static
  data:
    redis:
      host: localhost
      port: 6379
      password:
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 100
          max-idle: 20
          min-idle: 10
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.app.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  jwt:
    secret: PhotoManagementSystemJwtSecretKey2024MustBeLongEnoughForHS256Algorithm
    expiration: 86400000
  upload:
    path: d:/客户端测试/photo-management/uploads
    image-path: d:/客户端测试/photo-management/images
    thumbnail-path: d:/客户端测试/photo-management/thumbnails
    video-path: d:/客户端测试/photo-management/videos
    ffmpeg-path: ffmpeg

search:
  image:
    engine: deep
    siamese-model-path: models/mobilenet_v2_feat/mobilenet_v2_feat.pt

pgvector:
  enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/photo_management
    username: postgres
    password: 123456

logging:
  level:
    com.app.service.PgVectorService: DEBUG
