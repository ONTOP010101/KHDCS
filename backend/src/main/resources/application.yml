server:
  port: 8080
  error:
    include-message: always
    include-exception: true
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain,text/css,application/javascript,image/webp
    min-response-size: 1024
  undertow:
    max-http-post-size: -1
    idle-timeout: 300000
    no-request-timeout: 300000
    mime-mappings:
      webp: image/webp
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/photo_management?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&connectTimeout=30000&socketTimeout=60000
    username: root
    password: 123456
    hikari:
      maximum-pool-size: 200
      minimum-idle: 20
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 600000
      leak-detection-threshold: 30000
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/resources/static
  data:
    redis:
      host: localhost
      port: 6379
      password:
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 30
          max-idle: 8
          min-idle: 2
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false
  elasticsearch:
    uris: http://localhost:9208
    connection-timeout: 2s
    socket-timeout: 5s

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.app.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  jwt:
    secret: PhotoManagementSystemJwtSecretKey2024MustBeLongEnoughForHS256Algorithm
    expiration: 86400000
  upload:
    path: d:/客户端测试/photo-management/uploads
    image-path: d:/客户端测试/photo-management/images
    thumbnail-path: d:/客户端测试/photo-management/thumbnails
    video-path: d:/客户端测试/photo-management/videos
    ffmpeg-path: ffmpeg

search:
  image:
    engine: deep
    siamese-model-path: models/mobilenet_v2_feat/mobilenet_v2_feat.pt

pgvector:
  enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/photo_management
    username: postgres
    password: 123456

elasticsearch:
  enabled: true
  fallback-enabled: true
  timeout: 2000
  index:
    name: samples

