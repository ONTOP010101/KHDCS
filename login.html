<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>拍照管理系统 - 登录</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js"></script>

  <style>
    :root {
      --blue: #007aff;
      --blue-light: #5ac8fa;
      --blue-deep: #005ecb;
      --purple: #5e5ce6;
      --green: #34c759;
      --text: #1d1d1f;
      --muted: rgba(29, 29, 31, 0.58);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0; min-height: 100%;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;
      background: #f5f9ff;
      color: var(--text);
    }

    body { overflow: hidden; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px) scale(0.98); filter: blur(12px); }
      to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }

    @keyframes floatA {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(28px, -36px, 0) scale(1.08); }
    }

    @keyframes floatB {
      0%, 100% { transform: translate3d(0, 0, 0) rotate(0deg) scale(1); }
      50% { transform: translate3d(-38px, 24px, 0) rotate(8deg) scale(1.06); }
    }

    @keyframes rotateGlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes scanLine {
      0% { transform: translateY(-120%); opacity: 0; }
      20% { opacity: 0.55; }
      80% { opacity: 0.55; }
      100% { transform: translateY(120%); opacity: 0; }
    }

    @keyframes shine {
      0% { transform: translateX(-120%) skewX(-20deg); }
      100% { transform: translateX(160%) skewX(-20deg); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .login-page {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      padding: 28px; overflow: hidden;
      background:
        radial-gradient(circle at 18% 18%, rgba(0, 122, 255, 0.22), transparent 32%),
        radial-gradient(circle at 84% 14%, rgba(90, 200, 250, 0.22), transparent 34%),
        radial-gradient(circle at 68% 86%, rgba(94, 92, 230, 0.13), transparent 36%),
        linear-gradient(135deg, #ffffff 0%, #eef7ff 45%, #f8fbff 100%);
    }

    .background-grid {
      position: absolute; inset: 0; opacity: 0.55;
      background-image:
        linear-gradient(rgba(0, 122, 255, 0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 122, 255, 0.07) 1px, transparent 1px);
      background-size: 52px 52px;
      mask-image: radial-gradient(circle at center, black 0%, transparent 72%);
      -webkit-mask-image: radial-gradient(circle at center, black 0%, transparent 72%);
    }

    .noise {
      position: absolute; inset: 0; opacity: 0.08; pointer-events: none;
      background-image: radial-gradient(rgba(0, 122, 255, 0.7) 0.45px, transparent 0.45px);
      background-size: 4px 4px;
      mix-blend-mode: multiply;
    }

    .orb {
      position: absolute; border-radius: 999px;
      filter: blur(52px); opacity: 0.62; pointer-events: none;
    }
    .orb-1 { width: 430px; height: 430px; top: -120px; left: -120px; background: rgba(0, 122, 255, 0.32); animation: floatA 9s ease-in-out infinite; }
    .orb-2 { width: 520px; height: 520px; right: -170px; top: 90px; background: rgba(90, 200, 250, 0.28); animation: floatB 11s ease-in-out infinite; }
    .orb-3 { width: 380px; height: 380px; bottom: -120px; left: 36%; background: rgba(94, 92, 230, 0.16); animation: floatA 12s ease-in-out infinite 1s; }

    .login-shell {
      position: relative; z-index: 2;
      width: min(1120px, 100%);
      min-height: 660px;
      display: grid;
      grid-template-columns: 1.12fr 0.88fr;
      border-radius: 38px; overflow: hidden;
      background: rgba(255, 255, 255, 0.68);
      border: 1px solid rgba(255, 255, 255, 0.86);
      box-shadow:
        0 36px 100px rgba(0, 91, 181, 0.14),
        0 16px 42px rgba(0, 91, 181, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(36px) saturate(180%);
      -webkit-backdrop-filter: blur(36px) saturate(180%);
      animation: fadeUp 0.75s cubic-bezier(.2,.8,.2,1);
    }

    .login-shell::before {
      content: ""; position: absolute; inset: -2px;
      background: conic-gradient(
        from 180deg,
        transparent,
        rgba(0, 122, 255, 0.34),
        rgba(90, 200, 250, 0.32),
        rgba(94, 92, 230, 0.18),
        transparent,
        transparent
      );
      filter: blur(20px); opacity: 0.34; z-index: -1;
      animation: rotateGlow 12s linear infinite;
    }

    .hero-panel {
      position: relative; padding: 58px; overflow: hidden;
      display: flex; flex-direction: column; justify-content: space-between;
      background:
        radial-gradient(circle at 26% 18%, rgba(255, 255, 255, 0.95), transparent 28%),
        radial-gradient(circle at 74% 64%, rgba(0, 122, 255, 0.15), transparent 36%),
        linear-gradient(145deg, rgba(255,255,255,0.9), rgba(232,245,255,0.62));
      border-right: 1px solid rgba(0, 122, 255, 0.1);
    }

    .hero-top { position: relative; z-index: 2; }

    .brand-row { display: flex; align-items: center; gap: 14px; }

    .logo-box {
      width: 62px; height: 62px; border-radius: 20px; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(145deg, rgba(255,255,255,0.98), rgba(235,247,255,0.86));
      border: 1px solid rgba(0, 122, 255, 0.14);
      box-shadow: 0 18px 42px rgba(0, 122, 255, 0.12), inset 0 1px 0 rgba(255,255,255,0.95);
    }
    .logo-box img { width: 100%; height: 100%; object-fit: contain; padding: 7px; }

    .brand-text { line-height: 1.2; }
    .brand-text strong { display: block; font-size: 18px; letter-spacing: -0.03em; color: #1d1d1f; }
    .brand-text span { display: block; margin-top: 3px; color: rgba(0, 122, 255, 0.72); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; }

    .hero-title { margin: 70px 0 0; max-width: 560px; font-size: clamp(44px, 5vw, 72px); line-height: 0.98; font-weight: 800; letter-spacing: -0.07em; color: #1d1d1f; }
    .hero-title span {
      display: block;
      background: linear-gradient(110deg, #1d1d1f 0%, #007aff 38%, #00a6ff 66%, #5e5ce6 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }

    .hero-desc { margin-top: 24px; max-width: 460px; color: rgba(29, 29, 31, 0.62); font-size: 15px; line-height: 1.8; letter-spacing: -0.01em; }

    /* 视觉装饰区 */
    .visual-stage {
      position: absolute; right: 24px; bottom: 34px;
      width: 420px; height: 360px; pointer-events: none;
    }

    .phone-card {
      position: absolute; right: 72px; bottom: 0;
      width: 210px; height: 330px; border-radius: 38px;
      background: linear-gradient(145deg, rgba(255,255,255,0.88), rgba(230,246,255,0.58));
      border: 1px solid rgba(0,122,255,0.14);
      box-shadow: 0 28px 70px rgba(0,122,255,0.14), 0 10px 28px rgba(0,0,0,0.06), inset 0 1px 0 rgba(255,255,255,0.95);
      backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
      overflow: hidden; transform: rotate(-7deg);
    }

    .phone-card::before {
      content: ""; position: absolute; top: 12px; left: 50%;
      width: 74px; height: 22px; transform: translateX(-50%);
      border-radius: 999px; background: rgba(29, 29, 31, 0.78);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.15);
    }

    .phone-screen {
      position: absolute; inset: 48px 14px 14px; border-radius: 28px; overflow: hidden;
      background: radial-gradient(circle at 50% 0%, rgba(0,122,255,0.28), transparent 38%), linear-gradient(180deg, #f8fcff, #dceeff);
      border: 1px solid rgba(0,122,255,0.12);
    }

    .phone-screen::after {
      content: ""; position: absolute; left: 0; right: 0; height: 80px;
      background: linear-gradient(180deg, transparent, rgba(0,122,255,0.16), transparent);
      animation: scanLine 4s ease-in-out infinite;
    }

    .camera-circle {
      position: absolute; left: 50%; top: 42%;
      width: 94px; height: 94px; transform: translate(-50%, -50%); border-radius: 50%;
      background:
        radial-gradient(circle, rgba(255,255,255,1) 0 8%, transparent 9%),
        radial-gradient(circle, rgba(0,122,255,0.18) 0 38%, transparent 40%),
        conic-gradient(from 90deg, #007aff, #5ac8fa, #5e5ce6, #007aff);
      box-shadow: 0 0 34px rgba(0,122,255,0.28), inset 0 0 18px rgba(255,255,255,0.72);
      opacity: 0.96;
    }

    .photo-chip {
      position: absolute; border-radius: 22px;
      background: linear-gradient(145deg, rgba(255,255,255,0.88), rgba(229,245,255,0.58));
      border: 1px solid rgba(0,122,255,0.13);
      box-shadow: 0 18px 40px rgba(0,122,255,0.12), 0 8px 18px rgba(0,0,0,0.04);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    }
    .photo-chip.one { width: 168px; height: 108px; left: 0; top: 92px; transform: rotate(9deg); }
    .photo-chip.two { width: 150px; height: 94px; right: 0; top: 16px; transform: rotate(-12deg); }
    .photo-chip.three { width: 176px; height: 100px; left: 46px; bottom: 32px; transform: rotate(8deg); }

    .chip-inner {
      position: absolute; inset: 12px; border-radius: 16px;
      background: linear-gradient(135deg, rgba(0,122,255,0.76), rgba(90,200,250,0.46)), radial-gradient(circle at 70% 24%, rgba(255,255,255,0.9), transparent 18%);
      overflow: hidden;
    }

    .chip-inner::before {
      content: ""; position: absolute; left: 12px; bottom: 12px;
      width: 54%; height: 7px; border-radius: 999px;
      background: rgba(255,255,255,0.88);
      box-shadow: 0 16px 0 rgba(255,255,255,0.5);
    }

    .hero-bottom {
      position: relative; z-index: 3;
      display: flex; align-items: center; gap: 12px;
      color: rgba(29, 29, 31, 0.54); font-size: 13px;
    }

    .status-dot {
      width: 9px; height: 9px; border-radius: 999px;
      background: var(--green);
      box-shadow: 0 0 0 7px rgba(52, 199, 89, 0.14), 0 0 18px rgba(52, 199, 89, 0.42);
    }

    /* 表单面板 */
    .form-panel {
      position: relative; padding: 58px 52px;
      display: flex; align-items: center;
      background: linear-gradient(180deg, rgba(255,255,255,0.84), rgba(244,250,255,0.72));
    }

    .form-card { width: 100%; max-width: 390px; margin: 0 auto; color: #1d1d1f; }

    .mobile-logo {
      display: none; width: 64px; height: 64px; margin: 0 auto 22px;
      border-radius: 22px; overflow: hidden;
      align-items: center; justify-content: center;
      background: rgba(255,255,255,0.9);
      border: 1px solid rgba(0,122,255,0.14);
      box-shadow: 0 16px 34px rgba(0,122,255,0.12);
    }
    .mobile-logo img { width: 100%; height: 100%; object-fit: contain; padding: 7px; }

    .form-eyebrow {
      display: inline-flex; align-items: center; gap: 7px;
      height: 30px; padding: 0 11px; border-radius: 999px;
      font-size: 12px; color: rgba(0, 122, 255, 0.78);
      background: rgba(0, 122, 255, 0.08);
      border: 1px solid rgba(0, 122, 255, 0.13);
      margin-bottom: 18px;
    }
    .form-eyebrow i { width: 14px; height: 14px; color: #007aff; }

    .form-title { margin: 0; font-size: 34px; line-height: 1.12; font-weight: 760; letter-spacing: -0.055em; color: #1d1d1f; }
    .form-subtitle { margin: 10px 0 30px; color: rgba(29, 29, 31, 0.56); font-size: 14px; line-height: 1.7; letter-spacing: -0.01em; }

    .login-error {
      display: none; align-items: center; gap: 9px; margin-bottom: 18px;
      padding: 12px 13px; min-height: 44px; border-radius: 16px;
      color: #b42318; font-size: 13px; line-height: 1.45;
      background: rgba(255, 239, 238, 0.88);
      border: 1px solid rgba(255, 59, 48, 0.18);
      box-shadow: 0 14px 32px rgba(255, 59, 48, 0.08);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    }
    .login-error.show { display: flex; animation: shake 0.42s ease; }
    .login-error i { width: 17px; height: 17px; flex-shrink: 0; }

    .field-group { margin-bottom: 17px; }
    .field-label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 600; color: rgba(29, 29, 31, 0.72); letter-spacing: -0.01em; }
    .input-wrap { position: relative; }

    .login-input {
      width: 100%; height: 54px; padding: 0 48px;
      border: 1px solid rgba(0, 122, 255, 0.13); border-radius: 18px;
      outline: none; color: #1d1d1f; font-size: 15px; letter-spacing: -0.01em;
      background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(245,250,255,0.88));
      box-shadow: inset 0 1px 0 rgba(255,255,255,1), 0 12px 26px rgba(0,122,255,0.06);
      transition: border-color 0.22s ease, box-shadow 0.22s ease, background 0.22s ease, transform 0.22s ease;
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    }
    .login-input::placeholder { color: rgba(29, 29, 31, 0.34); }
    .login-input:hover {
      background: linear-gradient(180deg, rgba(255,255,255,1), rgba(239,248,255,0.95));
      border-color: rgba(0, 122, 255, 0.22);
    }
    .login-input:focus {
      transform: translateY(-1px);
      border-color: rgba(0,122,255,0.72); background: #ffffff;
      box-shadow: 0 0 0 4px rgba(0,122,255,0.14), 0 20px 38px rgba(0,122,255,0.12), inset 0 1px 0 rgba(255,255,255,1);
    }

    .login-input-icon {
      position: absolute; left: 17px; top: 50%;
      width: 18px; height: 18px; transform: translateY(-50%);
      color: rgba(29, 29, 31, 0.38); pointer-events: none; transition: color 0.22s ease;
    }
    .login-input:focus + .login-input-icon,
    .login-input:focus ~ .login-input-icon { color: #007aff; }

    .password-toggle {
      position: absolute; right: 12px; top: 50%;
      width: 34px; height: 34px; transform: translateY(-50%);
      border: 0; border-radius: 999px; background: transparent;
      color: rgba(29, 29, 31, 0.42);
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .password-toggle:hover { background: rgba(0, 122, 255, 0.08); color: #007aff; }

    .form-options { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 5px 0 25px; }

    .login-remember {
      display: inline-flex; align-items: center; gap: 9px;
      color: rgba(29, 29, 31, 0.56); font-size: 13px; cursor: pointer; user-select: none; white-space: nowrap;
    }
    .login-remember input { width: 17px; height: 17px; accent-color: var(--blue); cursor: pointer; }

    .forgot-link { color: #007aff; font-size: 13px; text-decoration: none; font-weight: 600; white-space: nowrap; }
    .forgot-link:hover { color: #005ecb; text-decoration: underline; text-underline-offset: 3px; }

    .login-btn {
      position: relative; width: 100%; height: 56px; border: 0; border-radius: 18px; overflow: hidden;
      cursor: pointer; color: #fff; font-size: 16px; font-weight: 700; letter-spacing: -0.015em;
      display: flex; align-items: center; justify-content: center; gap: 9px;
      background: linear-gradient(180deg, rgba(255,255,255,0.32), transparent), linear-gradient(135deg, #0a84ff 0%, #007aff 48%, #00a6ff 100%);
      box-shadow: 0 20px 46px rgba(0,122,255,0.26), 0 10px 24px rgba(90,200,250,0.16), inset 0 1px 0 rgba(255,255,255,0.38);
      transition: transform 0.22s ease, box-shadow 0.22s ease, filter 0.22s ease, opacity 0.22s ease;
    }
    .login-btn::before {
      content: ""; position: absolute; top: 0; bottom: 0; width: 80px; left: -100px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.38), transparent);
      animation: shine 3.6s ease-in-out infinite;
    }
    .login-btn:hover {
      transform: translateY(-2px); filter: saturate(1.12);
      box-shadow: 0 25px 56px rgba(0,122,255,0.32), 0 14px 32px rgba(90,200,250,0.22), inset 0 1px 0 rgba(255,255,255,0.42);
    }
    .login-btn:active {
      transform: translateY(0);
      box-shadow: 0 12px 28px rgba(0,122,255,0.24), inset 0 1px 0 rgba(255,255,255,0.24);
    }
    .login-btn:disabled { cursor: not-allowed; opacity: 0.6; transform: none; box-shadow: none; }

    .btn-spinner {
      display: none; width: 17px; height: 17px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.42); border-top-color: #fff;
      animation: spin 0.8s linear infinite;
    }
    .login-btn.loading .btn-spinner { display: inline-block; }
    .login-btn.loading .btn-arrow { display: none; }

    .secure-row {
      margin-top: 18px; display: flex; align-items: center; justify-content: center; gap: 7px;
      color: rgba(29,29,31,0.46); font-size: 12px;
    }
    .secure-row i { width: 14px; height: 14px; color: #34c759; }

    .form-footer { margin-top: 24px; padding-top: 22px; border-top: 1px solid rgba(0, 122, 255, 0.1); text-align: center; }
    .form-footer p { margin: 0; color: rgba(29,29,31,0.38); font-size: 12px; }

    @media (max-width: 940px) {
      body { overflow: auto; }
      .login-page { min-height: 100vh; align-items: flex-start; padding: 22px; }
      .login-shell { display: block; min-height: auto; border-radius: 32px; }
      .hero-panel { display: none; }
      .form-panel { padding: 44px 28px 36px; }
      .form-card { max-width: none; }
      .mobile-logo { display: flex; }
      .form-eyebrow { margin-left: auto; margin-right: auto; display: flex; width: fit-content; }
      .form-title, .form-subtitle { text-align: center; }
    }

    @media (max-width: 430px) {
      .login-page { padding: 14px; }
      .login-shell { border-radius: 28px; }
      .form-panel { padding: 34px 22px 30px; }
      .form-title { font-size: 30px; }
      .login-input, .login-btn { height: 52px; }
    }
  </style>
</head>

<body>
  <div class="login-page" id="page-login">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="background-grid"></div>
    <div class="noise"></div>

    <main class="login-shell">
      <!-- 左侧品牌展示区 -->
      <section class="hero-panel">
        <div class="hero-top">
          <div class="brand-row">
            <div class="logo-box">
              <img src="LOGO(1).png" alt="LOGO">
            </div>
            <div class="brand-text">
              <strong>拍照管理系统</strong>
              <span>ON TOP</span>
            </div>
          </div>

          <h1 class="hero-title">
            Capture.
            <span>Manage.</span>
            Deliver.
          </h1>

          <p class="hero-desc">
            以更高级、更智能的方式管理拍摄任务、影像资产与交付流程。
            专为高效团队打造的照片管理工作台。
          </p>
        </div>

        <div class="visual-stage">
          <div class="photo-chip one"><div class="chip-inner"></div></div>
          <div class="photo-chip two"><div class="chip-inner"></div></div>
          <div class="photo-chip three"><div class="chip-inner"></div></div>
          <div class="phone-card">
            <div class="phone-screen">
              <div class="camera-circle"></div>
            </div>
          </div>
        </div>

        <div class="hero-bottom">
          <span class="status-dot"></span>
          <span>System Online · Secure Photo Workflow</span>
        </div>
      </section>

      <!-- 右侧表单区 -->
      <section class="form-panel">
        <div class="form-card">
          <div class="mobile-logo">
            <img src="LOGO(1).png" alt="LOGO">
          </div>

          <div class="form-eyebrow">
            <i data-lucide="sparkles"></i>
            <span>Secure Access</span>
          </div>

          <h2 class="form-title">欢迎回来</h2>
          <p class="form-subtitle">登录后继续管理拍摄任务、照片数据和业务流程。</p>

          <div class="login-error" id="login-error">
            <i data-lucide="alert-circle"></i>
            <span id="login-error-msg">用户名或密码错误</span>
          </div>

          <div class="field-group">
            <label class="field-label" for="login-username">用户名</label>
            <div class="input-wrap">
              <input type="text" id="login-username" class="login-input" placeholder="请输入用户名" autocomplete="username" />
              <i data-lucide="user" class="login-input-icon"></i>
            </div>
          </div>

          <div class="field-group">
            <label class="field-label" for="login-password">密码</label>
            <div class="input-wrap">
              <input type="password" id="login-password" class="login-input" placeholder="请输入密码" autocomplete="current-password" />
              <i data-lucide="lock" class="login-input-icon"></i>
              <button type="button" class="password-toggle" id="password-toggle" aria-label="显示或隐藏密码">
                <i data-lucide="eye" class="w-4 h-4"></i>
              </button>
            </div>
          </div>

          <div class="form-options">
            <label class="login-remember">
              <input type="checkbox" id="login-remember" />
              <span>记住我</span>
            </label>
            <a href="javascript:void(0)" class="forgot-link" id="login-forgot-pwd">忘记密码？</a>
          </div>

          <button class="login-btn" id="login-submit-btn">
            <span class="btn-spinner"></span>
            <span class="btn-text">登录系统</span>
            <i data-lucide="arrow-right" class="w-4 h-4 btn-arrow"></i>
          </button>

          <div class="secure-row">
            <i data-lucide="shield-check"></i>
            <span>加密连接 · 安全登录</span>
          </div>

          <div class="form-footer">
            <p>请联系管理员获取登录账号</p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    lucide.createIcons();

    var submitBtn = document.getElementById('login-submit-btn');
    var usernameInput = document.getElementById('login-username');
    var passwordInput = document.getElementById('login-password');
    var errorEl = document.getElementById('login-error');
    var errorMsg = document.getElementById('login-error-msg');
    var passwordToggle = document.getElementById('password-toggle');

    function showError(message) {
      errorMsg.textContent = message;
      errorEl.classList.remove('show');
      void errorEl.offsetWidth;
      errorEl.classList.add('show');
    }

    function hideError() { errorEl.classList.remove('show'); }

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      if (isLoading) {
        submitBtn.classList.add('loading');
        submitBtn.querySelector('.btn-text').textContent = '登录中...';
      } else {
        submitBtn.classList.remove('loading');
        submitBtn.querySelector('.btn-text').textContent = '登录系统';
      }
    }

    submitBtn.addEventListener('click', function() {
      var username = usernameInput.value.trim();
      var password = passwordInput.value;

      if (!username || !password) { showError('请输入用户名和密码'); return; }

      hideError();
      setLoading(true);

      fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: username, password: password })
      })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (data.success) {
          if (document.getElementById('login-remember').checked) {
            localStorage.setItem('token', data.token);
          } else {
            sessionStorage.setItem('token', data.token);
          }
          window.location.href = '/';
        } else {
          showError(data.message || '用户名或密码错误');
        }
      })
      .catch(function() { showError('网络错误，请稍后重试'); })
      .finally(function() { setLoading(false); });
    });

    usernameInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') passwordInput.focus();
    });

    passwordInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') submitBtn.click();
    });

    document.getElementById('login-forgot-pwd').addEventListener('click', function() {
      alert('请联系管理员重置密码');
    });

    passwordToggle.addEventListener('click', function() {
      var isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      passwordToggle.innerHTML = isPassword
        ? '<i data-lucide="eye-off" class="w-4 h-4"></i>'
        : '<i data-lucide="eye" class="w-4 h-4"></i>';
      lucide.createIcons();
    });
  </script>
</body>
</html>
